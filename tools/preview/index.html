<meta charset="utf-8">
<title>Pofi Adası Önizleme</title>
<meta name="theme-color" content="#5CC7FA">
<style>
/* Tek görünüm: oyunun kendi gökyüzü rengi, tema değişmez */
:root { --sky: #5CC7FA; --sand: #FFE3A3; --ink: #0F2B45; --white: #FFFFFF; --sun: #FFB21A; color-scheme: light; }
html, body { height: 100%; }
body { margin: 0; background: var(--sky); color: var(--ink); font-family: -apple-system, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif; overflow: hidden; }
#stage { position: fixed; inset: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
#unity-canvas { width: 100%; height: 100%; display: block; background: var(--sky); touch-action: none; }
#loader { position: fixed; inset: 0; display: grid; align-items: start; justify-items: center; background: var(--sky) url('keyart.jpg') center 70% / cover no-repeat; padding: max(18px, env(safe-area-inset-top)) 24px 24px; text-align: center; }
#loader::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(10,40,80,.45), rgba(10,40,80,0) 38%); }   /* yazı üstte: tavşan açıkta kalsın */
#loader .box { position: relative; }
#loader .box { display: grid; gap: 12px; width: min(420px, 100%); }
#loader h1 { margin: 0; font-size: 44px; font-weight: 900; color: var(--white); letter-spacing: .5px; text-shadow: 0 4px 0 #E8761A, 0 8px 18px rgba(0,0,0,.35); }
#loader p { margin: 0; font-size: 15px; font-weight: 700; color: var(--white); text-shadow: 0 2px 6px rgba(0,0,0,.45); }
.bar { height: 16px; border-radius: 999px; background: rgba(255,255,255,.55); overflow: hidden; box-shadow: 0 3px 0 rgba(0,0,0,.15) inset; }
.bar i { display: block; height: 100%; width: 0%; background: var(--sun); border-radius: 999px; transition: width .2s; }
#err { display: none; background: var(--white); border-radius: 16px; padding: 16px; font-size: 14px; text-align: left; line-height: 1.5; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
#rotate { position: fixed; inset: 0; display: none; place-items: center; background: var(--sky); color: var(--white); text-align: center; padding: 24px; z-index: 10; font: 700 22px/1.4 system-ui, sans-serif; }
#rotate .icon { font-size: 64px; display: block; margin-bottom: 12px; }
@media (orientation: portrait) { #rotate { display: grid; } }
</style>

<div id="stage"><canvas id="unity-canvas" tabindex="-1" aria-label="Pofi Adası oyun ekranı"></canvas></div>
<div id="rotate"><div><span class="icon">&#x21bb;</span>Pofi Adası yatay oynanır.<br>Telefonunu yan çevir.</div></div>
<div id="loader" role="status" aria-live="polite">
  <div class="box">
    <h1>Pofi Adası</h1>
    <p id="msg">Ada hazırlanıyor… (ilk açılış biraz sürebilir)</p>
    <div class="bar" aria-hidden="true"><i id="fill"></i></div>
    <div id="err"></div>
  </div>
</div>

<script>
(function () {
  // iPhone: yan taraftaki sessiz düğmesi açıkken de oyun sesi (müzik/efekt) duyulsun (Safari 16.4+)
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  var fill = document.getElementById('fill');
  var msg = document.getElementById('msg');
  var err = document.getElementById('err');
  var loader = document.getElementById('loader');
  function fail(text) {
    msg.textContent = 'Önizleme açılamadı.';
    err.style.display = 'block';
    err.textContent = text + ' Bu ekranın görüntüsünü alıp Claude\'a gönderebilirsin.';
  }
  var canvas = document.getElementById('unity-canvas');
  var testGl = document.createElement('canvas').getContext('webgl2');
  if (!testGl) { fail('Bu tarayıcı 3D grafik (WebGL 2) desteklemiyor. iPhone\'da Safari\'yi güncel tutman yeterli.'); return; }
  var config = {
    dataUrl: 'Build/PofiAdasi.data.wasm',
    frameworkUrl: 'Build/PofiAdasi.framework.wasm',
    codeUrl: 'Build/PofiAdasi.code.wasm',
    streamingAssetsUrl: 'StreamingAssets',
    companyName: 'GameApp',
    productName: 'Pofi Adası',
    productVersion: '0.0.1',
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
  };
  // Veri dosyası önizleme sayfasının dosya sınırı yüzünden parçalı yayınlanabilir (parts.json); parçalar indirilip birleştirilir.
  function loadData(done) {
    fetch('Build/parts.json').then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }).then(function (info) {
      if (!info || !info.parts) { done(); return; }
      var got = 0, bufs = new Array(info.parts);
      msg.textContent = 'Ada indiriliyor… (ilk açılış biraz sürebilir)';
      for (let i = 0; i < info.parts; i++) {
        fetch('Build/PofiAdasi.data.part' + i + '.wasm').then(function (r) { return r.arrayBuffer(); }).then(function (b) {
          bufs[i] = b; got++;
          fill.style.width = Math.round(got / info.parts * 50) + '%';
          if (got === info.parts) { config.dataUrl = URL.createObjectURL(new Blob(bufs)); done(); }
        }).catch(function () { fail('Oyun dosyaları indirilemedi.'); });
      }
    });
  }
  var s = document.createElement('script');
  s.src = 'Build/PofiAdasi.loader.js';
  s.onerror = function () { fail('Oyun dosyaları yüklenemedi.'); };
  s.onload = function () {
    createUnityInstance(canvas, config, function (p) { fill.style.width = Math.round(50 + p * 50) + '%'; })
      .then(function (inst) { window.unityInstance = inst; loader.style.display = 'none'; })
      .catch(function (e) { fail('Hata: ' + (e && e.message ? e.message : e)); });
  };
  loadData(function () { document.body.appendChild(s); });
})();
</script>
